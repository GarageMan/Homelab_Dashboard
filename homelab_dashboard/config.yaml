name: Homelab Dashboard
version: "1.2.0"
slug: homelab_dashboard
description: >-
  Konsolidiertes Dashboard fuer HASS-Pi, Ubuntu-Server, Pi-hole und Synology
  DiskStation (CPU, Temp, RAM, Storage, Netzwerk, Updates, Pi-hole-Stats,
  Claude-Usage, Synology-Prozesse/-Benutzer/-Ordnergroessen).
url: "https://local/homelab-dashboard"
arch:
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant
panel_title: Homelab
hassio_api: true
hassio_role: default
homeassistant_api: true
options:
  ubuntu_host: "192.168.1.6"
  pihole_host: "192.168.1.5"
  glances_port: 61208
  pihole_password: ""
  usage_url: "http://192.168.1.7:8787/usage"
  refresh_seconds: 15
  website_url: ""
  website_name: "Webseite"
  synology_host: ""
  synology_port: 5001
  synology_https: true
  synology_user: ""
  synology_password: ""
  synology_device_id: ""
schema:
  ubuntu_host: str
  pihole_host: str
  glances_port: port
  pihole_password: password?
  usage_url: str?
  refresh_seconds: int(5,120)
  website_url: str?
  website_name: str?
  synology_host: str?
  synology_port: port?
  synology_https: bool?
  synology_user: str?
  synology_password: password?
  synology_device_id: str?
