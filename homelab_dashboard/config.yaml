name: Homelab Dashboard
version: "1.4.0"
slug: homelab_dashboard
description: >-
  Konsolidiertes Dashboard fuer HASS-Pi, Ubuntu-Server, Pi-hole, Synology
  DiskStation und FritzBox
url: "https://local/homelab-dashboard"
arch:
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant
panel_title: Homelab
hassio_api: true
hassio_role: default
homeassistant_api: true
options:
  refresh_seconds: 15
  glances_port: 61208
  ubuntu:
    host: "192.168.1.6"
  pihole:
    host: "192.168.1.5"
    password: ""
  website:
    url: ""
    name: "Webseite"
  claude_usage:
    url: "http://192.168.1.7:8787/usage"
  synology:
    host: ""
    port: 5001
    https: true
    user: ""
    password: ""
    device_id: ""
  fritzbox:
    host: ""
    user: ""
    password: ""
schema:
  refresh_seconds: int(5,120)
  glances_port: port
  ubuntu:
    host: str
  pihole:
    host: str
    password: password?
  website:
    url: str?
    name: str?
  claude_usage:
    url: str?
  synology:
    host: str?
    port: port?
    https: bool?
    user: str?
    password: password?
    device_id: str?
  fritzbox:
    host: str?
    user: str?
    password: password?
